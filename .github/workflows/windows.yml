name: Windows

# Builds and tests the Windows app (windows/) and uploads a self-contained Yippy.exe as an artifact.
# Every push or merge to master that changes the Windows app also publishes it as a GitHub release.
#
# Windows releases are tagged windows-vX.Y.Z, separately from the macOS v-tags. The version is <Version> from
# windows/Directory.Build.props, unless a windows-v tag for it (or a later one) already exists, in which case the
# patch number of the latest one is incremented. To start a new minor or major version, raise <Version>.
on:
  push:
    branches: [master]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  # Running it by hand on master publishes a release too
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the version
        id: version
        run: |
          base="$(sed -nE 's|.*<Version>([0-9]+\.[0-9]+\.[0-9]+)</Version>.*|\1|p' Directory.Build.props | head -n 1)"
          latest="$(git tag --list 'windows-v*' | sed -E 's/^windows-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          echo "Project version: $base, latest Windows tag: ${latest:-none}"
          highest="$(printf '%s\n%s\n' "${latest:-0.0.0}" "$base" | sort -V | tail -n 1)"
          if [ "$highest" = "$base" ] && [ "$base" != "$latest" ]; then
            version="$base"
          else
            IFS=. read -r major minor patch <<< "$latest"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "Version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Yippy.sln -c Release -p:Version=${{ needs.version.outputs.version }}

      - name: Test
        run: dotnet test Yippy.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Publish Yippy.exe
        run: >
          dotnet publish src/Yippy.App/Yippy.App.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }} -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Yippy-win-x64
          path: windows/publish/Yippy.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: windows/TestResults
          if-no-files-found: ignore

  release:
    needs: [version, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One release at a time, so two quick merges can't pick the same version
    concurrency:
      group: windows-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Yippy-win-x64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          exe="Yippy-$VERSION-win-x64.exe"
          mv Yippy.exe "$exe"
          # --latest=false keeps the macOS release as the repository's "Latest"
          gh release create "windows-v$VERSION" "$exe" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Yippy for Windows $VERSION" \
            --latest=false \
            --notes "Yippy for Windows 10 (1809 or later) and 11, x64. Download $exe and run it; it's self-contained, so .NET doesn't need to be installed. Yippy starts in the notification area: press Ctrl+Shift+V to open your clipboard history.

          The app isn't code-signed yet, so SmartScreen may warn the first time: choose More info, then Run anyway."
