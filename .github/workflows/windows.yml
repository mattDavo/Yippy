name: Windows

# Builds and tests the Windows app (windows/) and uploads a self-contained Yippy.exe as an artifact.
on:
  push:
    branches: [master]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Yippy.sln -c Release

      - name: Test
        run: dotnet test Yippy.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Publish Yippy.exe
        run: >
          dotnet publish src/Yippy.App/Yippy.App.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Yippy-win-x64
          path: windows/publish/Yippy.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: windows/TestResults
          if-no-files-found: ignore
